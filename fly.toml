# ============================================================
# CreatiHub — Fly.io app config
# After `fly launch`, edit app name/region as needed, then `fly deploy`.
# Custom domain:  fly certs add yourdomain.com
# Docs: https://fly.io/docs/app-guides/custom-domains-with-fly/
# ============================================================
app = "creatihub"
primary_region = "iad"          # iad (Virginia) | lhr (London) | sin (Singapore) | etc.

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0       # set to 1 to avoid cold starts

# Persistent volume for the JSON file database (survives redeploys)
[[mounts]]
  source = "creatihub_data"
  destination = "/data"
  initial_size = "1GB"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
